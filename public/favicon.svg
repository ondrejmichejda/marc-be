<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Modern Gradient -->
    <linearGradient id="marcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- M Letter Gradient -->
    <linearGradient id="marcMGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>

    <!-- Ambient Shadow for depth -->
    <filter id="marcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="36" height="36" rx="9" fill="url(#marcBgGrad)" />

  <!-- Subtle Glass Inner Border -->
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="white" stroke-opacity="0.2" stroke-width="1" />

  <!-- Modern M Monogram -->
  <g filter="url(#marcShadow)">
    <path
      d="M10 25.5V11L18 19L26 11V25.5"
      stroke="url(#marcMGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
